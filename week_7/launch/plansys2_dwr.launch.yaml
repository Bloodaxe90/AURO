launch:
- arg:
    name: namespace
    default: ''
    description: Namespace
- include:
    file: $(find-pkg-share plansys2_bringup)/launch/plansys2_bringup_launch_monolithic.py
    arg:
    - {name: model_file, value: $(find-pkg-share week_7_solution)/pddl/dwr.pddl}
    - {name: namespace, value: $(var namespace)}

- node:
    pkg: week_7_solution
    exec: move_action_node
    name: move_action_node
    namespace: $(var namespace)
    output: screen
- node:
    pkg: week_7_solution
    exec: load_action_node
    name: load_action_node
    namespace: $(var namespace)
    output: screen
- node:
    pkg: week_7_solution
    exec: unload_action_node
    name: unload_action_node
    namespace: $(var namespace)
    output: screen
- node:
    pkg: week_7_solution
    exec: take_action_node
    name: take_action_node
    namespace: $(var namespace)
    output: screen
- node:
    pkg: week_7_solution
    exec: put_action_node
    name: put_action_node
    namespace: $(var namespace)
    output: screen