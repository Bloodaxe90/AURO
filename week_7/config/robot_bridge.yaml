# ros_gz_bridge entries for one robot. The launch file starts one bridge per robot, in the robot's
# namespace and with expand_gz_topic_names, so every name here is relative and becomes
# /<robot>/<name> on both sides: e.g. /robot1/odom in ROS from /robot1/odom in Gazebo, where
# week_7/robot_model.py has moved the model's topics.
#
# /clock is not here: it is the world's, not a robot's, so a single bridge outside any namespace
# provides it (see week_7.launch.py).

# DiffDrive system
- ros_topic_name: cmd_vel
  gz_topic_name: cmd_vel
  ros_type_name: geometry_msgs/msg/TwistStamped
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ
- ros_topic_name: odom
  gz_topic_name: odom
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: tf
  gz_topic_name: tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# JointStatePublisher system, for robot_state_publisher
- ros_topic_name: joint_states
  gz_topic_name: joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# Sensors
- ros_topic_name: imu
  gz_topic_name: imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: scan
  gz_topic_name: scan
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: camera/image_raw
  gz_topic_name: camera/image_raw
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
- ros_topic_name: camera/camera_info
  gz_topic_name: camera/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
